{# Telegram orqali kiriş bloki. Kontekst: t, tg_bot_username, tg_auth_url #}
<div class="d-card d-cta">
  <h2 class="d-h2">🔐 {{ t.login_title }}</h2>
  <p>{{ t.login_text }}</p>
  {% if request.GET.login == "failed" %}<p class="d-note bad">⚠️ {{ t.login_failed }}</p>{% endif %}
  {% if tg_bot_username %}
  <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="{{ tg_bot_username }}"
    data-size="large" data-radius="10" data-auth-url="{{ tg_auth_url }}" data-request-access="write"></script>
  {% else %}
  <p class="d-meta">{{ t.login_unavailable }}</p>
  {% endif %}
</div>
