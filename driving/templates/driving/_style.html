{# Avtotest sahifalari (savol, imtihon, profil, reyting, yöl belgilari) uçun umumiy stillar #}
<style>
  :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#4f46e5}
  [data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--accent:#a5b4fc}
  *{box-sizing:border-box}
  /* "html ..." — izohlar bloki uchun ulanadigan Bootstrap stillari sahifani qayta bo'yab yubormasligi uchun */
  html body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  html a{color:var(--accent)}
  html .d-h1,html .d-h2{font-weight:700}
  .d-comments{padding-bottom:48px}
  [data-theme="dark"] .d-comments .card{background:var(--card);color:var(--text);border-color:var(--border)}
  [data-theme="dark"] .d-comments .form-control{background:var(--bg);color:var(--text);border-color:var(--border)}
  .d-main{max-width:860px;margin:0 auto;padding:20px 16px 64px}
  .d-crumbs{font-size:.88rem;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
  .d-crumbs a{color:inherit}
  .d-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  .d-h1{font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.3;margin:0 0 14px}
  .d-h2{font-size:1.15rem;margin:0 0 12px}
  .d-meta{color:var(--muted);font-size:.9rem}
  .d-img{display:block;max-width:100%;height:auto;border-radius:12px;margin:0 0 14px}
  .d-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;border-radius:12px;
    border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
  .d-opt:hover:not(:disabled){border-color:var(--accent)}
  .d-opt:disabled{cursor:default}
  .d-opt kbd{flex:0 0 auto;background:var(--border);color:var(--text);border-radius:6px;padding:1px 8px;font:inherit;font-size:.85rem}
  .d-opt.ok{background:rgba(34,197,94,.15);border-color:#22c55e}
  .d-opt.bad{background:rgba(239,68,68,.15);border-color:#ef4444}
  .d-note{padding:10px 14px;border-radius:10px;margin:8px 0 0}
  .d-note.ok{background:rgba(34,197,94,.15)} .d-note.bad{background:rgba(239,68,68,.15)}
  .d-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:0;font:inherit;font-weight:600;
    cursor:pointer;text-decoration:none!important;color:#fff!important;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .d-btn.alt{background:transparent;color:var(--text)!important;border:1px solid var(--border)}
  .d-btn.green{background:linear-gradient(135deg,#22c55e,#16a34a)}
  .d-btn:disabled{opacity:.5;cursor:default}
  .d-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .d-between{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
  .d-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .d-stats>div{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:center}
  .d-stats b{display:block;font-size:1.6rem;line-height:1.2}
  .d-stats span{font-size:.85rem;color:var(--muted)}
  .d-list{list-style:none;margin:0;padding:0}
  .d-list li{border-top:1px solid var(--border)}
  .d-list li:first-child{border-top:0}
  .d-list a{display:flex;gap:10px;padding:10px 4px;text-decoration:none;color:var(--text)}
  .d-list a b{color:var(--accent);min-width:2.2em}
  .d-list a[aria-current="page"]{font-weight:700}
  .d-bar{height:10px;border-radius:99px;background:var(--border);overflow:hidden}
  .d-bar div{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
  .d-table{width:100%;border-collapse:collapse}
  .d-table th,.d-table td{padding:9px 8px;border-top:1px solid var(--border);text-align:left}
  .d-table th{border-top:0;color:var(--muted);font-weight:600;font-size:.88rem}
  .d-table .n{text-align:right}
  .d-table tr.me td{background:rgba(99,102,241,.1);font-weight:600}
  .d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .d-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:1px solid var(--border);border-radius:12px;
    background:var(--card);color:var(--text);text-decoration:none;text-align:center;font-size:.9rem}
  .d-tile img{width:72px;height:72px;object-fit:contain}
  .d-tile:hover{border-color:var(--accent)}
  .d-cta{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12));border-color:rgba(99,102,241,.35)}
  details summary{cursor:pointer;font-weight:600;color:var(--accent)}
  @media (max-width:560px){.d-card{padding:16px}.d-btn{flex:1 1 auto}}
</style>
